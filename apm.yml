name: adr
version: 0.1.0
description: Agent config for working in this repository
targets:
  - claude
  - codex
# .apm/ にある、この repo だけで使う skill を配ることへの同意。書かないと apm audit は暗黙の同意として注意を出す。
includes: auto
# .mcp.json・.codex/config.toml・.claude/skills/・.agents/skills/ は apm install がここと .apm/ から生成する。
# どれも直接は書き換えない。
dependencies:
  apm:
    - boykush/wiki/plugins/wiki-remote-mcp#29d89d60302247578487059899805a7da39a72b2 # wiki-remote-mcp--v0.1.0
    - boykush/backstage-app/agent-plugins/catalog-remote-mcp#6c54c07ff81a2034cac9676f359af06df3a22cb7 # catalog-remote-mcp--v0.1.0
    # この repo が配る plugin を、consumer と同じ package として手元から受け取る。
    - ./plugins/adr-remote-mcp
  mcp: []
