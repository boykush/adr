name: adr
version: 0.1.0
description: Agent config for working in this repository
targets:
  - claude
  - codex
# .apm/ にある、この repo だけで使う skill を配ることへの同意。書かないと apm audit は暗黙の同意として注意を出す。
includes: auto
# .mcp.json・.codex/config.toml・.claude/skills/・.agents/skills/ は apm install がここと .apm/ から生成する。
# どれも直接は書き換えない。
dependencies:
  apm:
    - boykush/ai-plugins/plugins/wiki-remote-mcp#0de7adcb5bc12b2f1c914d1a1fc493efbd821b49
    - boykush/ai-plugins/plugins/catalog-remote-mcp#0de7adcb5bc12b2f1c914d1a1fc493efbd821b49
    # この repo が配る plugin を、ai-plugins を通さずに受け取る。通すと skill を直すたびに
    # ai-plugins とこの repo の固定を往復で上げることになる。plugin の root を指さないのは、
    # apm が Agent Plugins の形を Claude と Codex へは展開しないため。
    - ./plugins/adr-remote-mcp/skills/ade-rule-dsl
    - ./plugins/adr-remote-mcp/skills/adr-check
    - ./plugins/adr-remote-mcp/skills/adr-review
  mcp:
    # plugins/adr-remote-mcp/mcp.json と同じ接続先。apm はその mcp.json を読まないので、ここでも宣言する。
    - name: adr
      registry: false
      transport: http
      url: https://adr-mcp.boykush.com/mcp
