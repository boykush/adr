# Ships the plugin under plugins/ from here: boykush/workflows writes and checks its
# apm.yml, and tags each version for consumers to pin.
name: agent-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  agent-plugins:
    uses: boykush/workflows/.github/workflows/agent-plugins.yml@ec5ae917e92e97a19c7339ff957029a4012c2915
    with:
      path: plugins
    permissions:
      contents: write
