# Ships the plugin under plugins/ from here: boykush/workflows writes and checks its
# apm.yml, and tags each version for consumers to pin.
name: agent-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  agent-plugins:
    uses: boykush/workflows/.github/workflows/agent-plugins.yml@1d62746c40f5ba797b939b7099abdf5465260391
    with:
      path: plugins
    permissions:
      contents: write
