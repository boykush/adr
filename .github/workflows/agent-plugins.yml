# Ships the plugin under plugins/ from here: boykush/workflows writes and checks its
# apm.yml, and tags each version for consumers to pin.
name: agent-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  agent-plugins:
    uses: boykush/workflows/.github/workflows/agent-plugins.yml@9f0c4bbede8b26ac245e296e123a3925616d289f
    with:
      path: plugins
    permissions:
      contents: write
