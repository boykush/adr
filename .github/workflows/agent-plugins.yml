# Ships the plugin under plugins/ from here: boykush/workflows writes and checks its
# apm.yml, and tags each version for consumers to pin.
name: agent-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  agent-plugins:
    uses: boykush/workflows/.github/workflows/agent-plugins.yml@15c87af5f38f796859b58308816e81224cefe83b
    with:
      path: plugins
    permissions:
      contents: write
