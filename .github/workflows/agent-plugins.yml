# Ships the plugin under plugins/ from here: boykush/workflows writes and checks its
# apm.yml, and tags each version for consumers to pin.
name: agent-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  agent-plugins:
    uses: boykush/workflows/.github/workflows/agent-plugins.yml@f4e8169e7cf790ea593c4647b4fff3701109d5b2
    with:
      path: plugins
    permissions:
      contents: write
