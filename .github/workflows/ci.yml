name: CI

on:
  pull_request:
  push:
    branches: [main]

# 既定は最小権限。必要なものだけ job で与える。
permissions: {}

# 同じ ref の古い run は畳む（PR への連続 push 等）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml に固定した版の Go と golangci-lint を入れる。install_args で
      # この2つに絞り、fork の clone（bootstrap）までは走らせない。
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go golangci-lint

      - name: Cache Go build & module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # どの検査も mise.toml のタスクを踏む。ステップを分けたままにするのは
      # 検査ごとに CI のステータスを出すため。
      - name: Format (gofmt)
        run: mise run fmt

      - name: Vet
        run: mise run vet

      - name: Lint (golangci-lint)
        run: mise run lint

      - name: Tidy (go.mod / go.sum)
        run: mise run tidy

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test
