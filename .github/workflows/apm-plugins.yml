# Ships the apm package under plugins/ from here: boykush/workflows checks it and tags
# each version for consumers to pin.
name: apm-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  apm-plugins:
    uses: boykush/workflows/.github/workflows/apm-plugins.yml@1ab7decb0df20d9d5ea5dbe5642345f22b59d0fa
    with:
      path: plugins
    permissions:
      contents: write
