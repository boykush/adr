# This repository's entities in boykush's Backstage catalog, found on main by its
# GitHub discovery (boykush/infrastructure-as-code's applications/backstage/).
# How an entity is written — which edges to draw, what a tag means — is set in
# boykush/github-management's AGENTS.md and the comments atop its catalog/ files.

# One entity for the path from a decision to a change checked against its rules. The
# sides that check (ai-review, a working session) reach it through adr-mcp, not as parts.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: adr
  description: repo をまたぐ設計上の決定を書き、ルールとして MCP で配る
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: user:boykush
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: adr
  description: >-
    repo をまたぐ設計上の決定（MADR）の置き場。決定は各 repo へ複製せず MCP で配る。対象は fork と
    archive を除く owned repo（user:boykush fork:false archived:false）
  annotations:
    backstage.io/kubernetes-label-selector: app.kubernetes.io/part-of=adr
  tags:
    - go
spec:
  type: repository
  lifecycle: production
  owner: user:boykush
  system: adr
  providesApis:
    - adr-mcp
  consumesApis:
    - adr-mcp
    - wiki-mcp
    - catalog-mcp
  dependsOn:
    - component:ai-plugins
    - component:workflows
    - resource:doks-cluster
    - resource:cloudflare-tunnel
    - resource:ghcr
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: adr-mcp
  description: >-
    boykush/adr の決定を読む remote MCP サーバー。読み取り専用・無認証。公開エンドポイントは
    infrastructure-as-code が持つ
  links:
    - url: https://github.com/boykush/adr/blob/main/plugins/adr-remote-mcp/mcp.json
      title: 接続先の持ち主（plugin adr-remote-mcp）
      icon: github
spec:
  type: mcp-server
  lifecycle: production
  owner: user:boykush
  system: adr
  remotes:
    - type: streamable-http
      url: https://adr-mcp.boykush.com/mcp
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: adr-remote-mcp
  description: >-
    adr-mcp への参照と、決定のルールを読み・照らす skill を束ねた plugin（Agent Plugins の形）。apm の
    package にして配るのは ai-plugins
  links:
    - url: https://backstage.boykush.com/catalog/default/api/adr-mcp
      title: MCP サーバー（adr-mcp）
      icon: kind:api
spec:
  type: plugin
  lifecycle: production
  owner: user:boykush
  system: adr
  skills:
    - airesource:ade-rule-dsl
    - airesource:adr-check
    - airesource:adr-review
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: ade-rule-dsl
  description: ルールが書かれている ADE の DSL の reference
  annotations:
    backstage.io/source-location: url:https://github.com/boykush/adr/tree/main/plugins/adr-remote-mcp/skills/ade-rule-dsl/
spec:
  type: skill
  lifecycle: production
  owner: user:boykush
  system: adr
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: adr-check
  description: 作業した変更をルールに照らす手順
  annotations:
    backstage.io/source-location: url:https://github.com/boykush/adr/tree/main/plugins/adr-remote-mcp/skills/adr-check/
spec:
  type: skill
  lifecycle: production
  owner: user:boykush
  system: adr
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: adr-review
  description: PR をルールに照らして判定する手順
  annotations:
    backstage.io/source-location: url:https://github.com/boykush/adr/tree/main/plugins/adr-remote-mcp/skills/adr-review/
spec:
  type: skill
  lifecycle: production
  owner: user:boykush
  system: adr
